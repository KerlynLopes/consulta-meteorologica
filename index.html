<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima & Céu</title>
    <link rel="icon" type="image/png" href="./images/favicon.png">
    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/script.js" defer></script>
</head>
<body>
<header class="cabecalho">
    <h1>Clima & Céu</h1>
</header>
<main>
    <section class="apresentacao">
        <h2>Descubra a previsão do tempo e planeje seus dias.</h2>

        <p>Encontre sua cidade:</p>

        <div class="busca">
            <span class="icone-localizacao">📍</span>

            <input
                type="text"
                id="cidade"
                placeholder="Digite o nome da sua cidade..."
                autocomplete="off"
            >

            <ul id="sugestoes-cidades"></ul>
        </div>
    </section>

    <section class="favoritos-container">
        <h2>Suas cidades favoritas ♡</h2>
        <div id="lista-favoritos"></div>
    </section>

    <section id="temperatura"></section>

    <section id="previsao"></section>
</main>

<footer>Feito por Kerlyn Lopes - 2026</footer>
</body>
</html>
